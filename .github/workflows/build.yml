name: Build Geode Mod

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Mod with Geode Action
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: 'geode-sdk/bindings'
          sdk: 'nightly'
          combine: true
